input_info:
  input_source: ../reference_data/eir-transformer/df_ehr_test.csv
  input_name: ehr
  input_type: sequence

input_type_info:
        sampling_strategy_if_longer: "uniform"
        max_length: 64
        split_on: " "
        min_freq: 10

model_config:
        model_type: sequence-default
        embedding_dim: 64
        position: embed
        pool: avg
        model_init_config:
          num_heads: 4
          dropout: 0.1
