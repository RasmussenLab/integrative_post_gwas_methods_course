<svg xmlns="http://www.w3.org/2000/svg" width="790" height="195" viewBox="0 0 790 195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Where the biomarker GRS helps in the sequence</title>
<desc>A single EHR token sequence spanning two visits. At the first visit there is no prior lab history, so the biomarker GRS is informative; at later visits the earlier LAB tokens already reveal the individual's level, so the GRS is redundant.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowgrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B0AEA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="150" y="18" width="190" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="245" y="36" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#4A1B0C">Biomarker GRS (tabular)</text>

<path d="M245 54 L267 94" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
<path d="M300 54 L672 94" fill="none" stroke="#B0AEA5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowgrey)"/>

<rect x="24" y="100" width="76" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="62" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">[VISIT_START]</text>
<rect x="106" y="100" width="76" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="144" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">AGE_60</text>
<rect x="188" y="100" width="76" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="226" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#04342C">LAB_HDL</text>
<rect x="270" y="100" width="76" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="308" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#04342C">LAB_BMI</text>
<rect x="352" y="100" width="76" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="390" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">[VISIT_END]</text>
<rect x="434" y="100" width="76" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="472" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">[VISIT_START]</text>
<rect x="516" y="100" width="76" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="554" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">AGE_63</text>
<rect x="598" y="100" width="76" height="32" rx="6" fill="#EFEEEA" stroke="#B0AEA5" stroke-width="0.5"/>
<text x="636" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6B6A64">LAB_HDL</text>
<rect x="680" y="100" width="76" height="32" rx="6" fill="#EFEEEA" stroke="#B0AEA5" stroke-width="0.5"/>
<text x="718" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6B6A64">LAB_BMI</text>

<path d="M188 140 V146 H346 V140" fill="none" stroke="#0F6E56" stroke-width="1"/>
<text x="267" y="162" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">first visit, no history yet</text>
<text x="267" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">GRS sets a personalized start</text>

<path d="M598 140 V146 H756 V140" fill="none" stroke="#B0AEA5" stroke-width="1"/>
<text x="677" y="162" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6B6A64">later visits, earlier LAB tokens</text>
<text x="677" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6B6A64">already reveal the level, GRS redundant</text>
</svg>
