<svg xmlns="http://www.w3.org/2000/svg" width="380" height="402" viewBox="0 0 380 402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>EHR sequence model pipeline</title>
<desc>Four stages: EHR token sequence, embedding plus positional encoding, eight transformer blocks, and a prediction head returning 234 logits.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="50" y="40" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">EHR token sequence</text>
<text x="190" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">vocabulary of 234 tokens</text>

<line x1="190" y1="98" x2="190" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="124" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Embedding + positional</text>
<text x="190" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">234 &#8594; 64, dropout 0.1</text>

<line x1="190" y1="182" x2="190" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="218" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="55" y="213" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="50" y="208" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Transformer blocks</text>
<text x="190" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">8 &#215; block, d = 64</text>

<line x1="190" y1="280" x2="190" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="306" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Prediction head</text>
<text x="190" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">RMSNorm &#8594; 64 &#8594; 234 logits</text>
</svg>
