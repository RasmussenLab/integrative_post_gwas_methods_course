<svg xmlns="http://www.w3.org/2000/svg" width="620" height="612" viewBox="0 0 620 612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Multimodal EHR sequence model pipeline</title>
<desc>An EHR token branch running through embedding and a four-block encoder, then a cross-attention fusion where a biomarker tabular branch enters, then a four-block output transformer and a prediction head.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="50" y="40" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="175" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">EHR token sequence</text>
<text x="175" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">vocabulary of 234 tokens</text>

<rect x="330" y="40" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="455" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Biomarker inputs</text>
<text x="455" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">23 features</text>

<line x1="175" y1="98" x2="175" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="124" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Embedding + positional</text>
<text x="175" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">234 &#8594; 64, dropout 0.1</text>

<line x1="175" y1="182" x2="175" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="218" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="55" y="213" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="50" y="208" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="175" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">EHR encoder</text>
<text x="175" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">4 &#215; block, d = 64</text>

<line x1="175" y1="278" x2="175" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M455 98 V348 H302" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="320" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="175" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Cross attention</text>

<line x1="175" y1="378" x2="175" y2="398" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="414" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="55" y="409" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="50" y="404" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="175" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Output transformer</text>
<text x="175" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">4 &#215; block, d = 64</text>

<line x1="175" y1="474" x2="175" y2="510" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="516" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="538" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Prediction head</text>
<text x="175" y="556" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">RMSNorm &#8594; 64 &#8594; 234 logits</text>
</svg>
